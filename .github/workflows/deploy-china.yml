name: Deploy China OSS/COS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: china-cdn
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      COS_REGION: ${{ secrets.COS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build China static site
        run: npm run build:china
      - name: Upload Aliyun OSS
        if: env.ALIYUN_ACCESS_KEY_ID != ''
        run: |
          curl -fsSL -o ossutil https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64
          chmod +x ossutil
          python3 -c "from pathlib import Path; import os; Path('.ossutilconfig').write_text('[Credentials]\nlanguage=EN\naccessKeyID=%s\naccessKeySecret=%s\nendpoint=%s\n' % (os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], os.environ['ALIYUN_OSS_ENDPOINT']))"
          ./ossutil cp -rf dist/ "oss://${ALIYUN_OSS_BUCKET}/" --config-file .ossutilconfig --update --force
      - name: Upload Tencent COS
        if: env.COS_SECRET_ID != ''
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.COS_SECRET_ID }}
          secret_key: ${{ secrets.COS_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
          local_path: dist
          remote_path: /
          clean: false
