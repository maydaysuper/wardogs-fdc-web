name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build:pages || true
        env:
          NITRO_PRESET: github_pages
          GITHUB_PAGES: "1"
      - name: Require prerendered HTML
        run: |
          ls -la .output/public || true
          test -e .output/public/index.html -o -e .output/public/404.html
          if [ ! -f .output/public/index.html ] && [ -f .output/public/404.html ]; then
            cp .output/public/404.html .output/public/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
