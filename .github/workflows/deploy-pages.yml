name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build client-only SPA
        run: npx vite build --config vite.spa.config.ts
        env:
          GITHUB_PAGES: "1"
      - name: Prepare publish dir
        run: |
          cp dist-spa/spa.html dist-spa/index.html
          cp dist-spa/spa.html dist-spa/404.html
          touch dist-spa/.nojekyll
          ls -la dist-spa dist-spa/assets
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-spa
          force_orphan: true
          keep_files: false
